<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="200" rx="16" fill="#f8fafc"/>

  <g>
    <rect x="24" y="52" width="180" height="96" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="114" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">1. Pick categories</text>
    <text x="114" y="106" text-anchor="middle" font-size="13" fill="#4b5563">Facts · Jokes · Motivation</text>
    <text x="114" y="126" text-anchor="middle" font-size="12" fill="#6b7280">one or more</text>
  </g>

  <line x1="204" y1="100" x2="238" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="242" y="52" width="180" height="96" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="332" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">2. Set the rhythm</text>
    <text x="332" y="106" text-anchor="middle" font-size="13" fill="#4b5563">1–3 items per day</text>
    <text x="332" y="126" text-anchor="middle" font-size="12" fill="#6b7280">and a time window</text>
  </g>

  <line x1="422" y1="100" x2="456" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="460" y="52" width="180" height="96" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="550" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">3. Local notifications</text>
    <text x="550" y="106" text-anchor="middle" font-size="13" fill="#4b5563">text inside the notification</text>
    <text x="550" y="126" text-anchor="middle" font-size="12" fill="#6b7280">~30 days ahead, no server</text>
  </g>

  <line x1="640" y1="100" x2="674" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="678" y="52" width="180" height="96" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="768" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">4. Read and react</text>
    <text x="768" y="106" text-anchor="middle" font-size="13" fill="#4b5563">source · like · share</text>
    <text x="768" y="126" text-anchor="middle" font-size="12" fill="#6b7280">dislike = never again</text>
  </g>

  <text x="440" y="178" text-anchor="middle" font-size="12" fill="#6b7280">Everything runs on the phone: bundled content, local scheduling, local favorites.</text>
</svg>
